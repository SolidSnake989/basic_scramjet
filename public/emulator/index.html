<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Play Games</title>

		<style>
			body {
				font-family: Arial, Helvetica, sans-serif;
				margin: 0;
				background: #111;
				color: #fff;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				padding: 24px 16px 48px;
				box-sizing: border-box;
			}
			h1 {
				margin: 8px 0 24px;
			}
			h2 {
				font-size: 1rem;
				color: rgba(255, 255, 255, 0.7);
				margin: 24px 0 8px;
			}
			section {
				width: 100%;
				max-width: 640px;
			}
			#game-list {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
			}
			#game-list p {
				color: rgba(255, 255, 255, 0.5);
			}
			button,
			select,
			input[type="file"] {
				font-family: inherit;
				font-size: 0.95rem;
				background: none;
				color: #fff;
				border: 1px solid rgba(255, 255, 255, 0.3);
				border-radius: 6px;
				padding: 8px 14px;
				cursor: pointer;
			}
			button:hover {
				border-color: rgba(255, 255, 255, 0.7);
			}
			.row {
				display: flex;
				flex-wrap: wrap;
				gap: 8px;
				align-items: center;
			}
			#status {
				min-height: 1.2em;
				color: rgba(255, 255, 255, 0.6);
				font-size: 0.9rem;
				margin-top: 8px;
				white-space: pre-wrap;
			}
			#canvas-wrapper {
				margin-top: 24px;
				width: 100%;
				max-width: min(92vw, 1400px);
				display: flex;
				flex-direction: column;
				align-items: center;
			}
			#game-canvas,
			#canvas {
				width: 100%;
				aspect-ratio: 4 / 3;
				background: #000;
				border: 1px solid rgba(255, 255, 255, 0.2);
			}
			/*
			 * RetroArch's Emscripten build renames/re-targets the live canvas to
			 * id="canvas" and sets an inline width/height style on it directly.
			 * Inline styles beat any plain selector regardless of specificity, so
			 * this is the one thing that can still override it.
			 */
			#canvas {
				width: calc(min(92vw, 1400px) * var(--emu-scale, 1)) !important;
				height: auto !important;
				max-width: 100% !important;
			}
			#canvas:fullscreen {
				width: auto !important;
				height: 100% !important;
				max-width: 100% !important;
				max-height: 100% !important;
				margin: auto;
			}
			#scale-label {
				min-width: 3.5em;
				text-align: center;
				color: rgba(255, 255, 255, 0.7);
				font-size: 0.9rem;
			}
			#controls {
				margin-top: 12px;
			}
			#controls-help {
				margin-top: 24px;
				width: 100%;
				max-width: min(92vw, 1400px);
				background: rgba(255, 255, 255, 0.05);
				border: 1px solid rgba(255, 255, 255, 0.2);
				border-radius: 8px;
				padding: 10px 16px;
				font-size: 0.85rem;
				box-sizing: border-box;
			}
			#controls-help ul {
				margin: 0;
				padding: 0;
				list-style: none;
				display: flex;
				flex-wrap: wrap;
				gap: 6px 20px;
				justify-content: center;
			}
			#controls-help .key {
				color: rgba(255, 255, 255, 0.5);
			}
			#controls-help .key::after {
				content: ": ";
			}
		</style>
	</head>

	<body>
		<h1>Play Games</h1>

		<section id="library-section">
			<h2>Game Library</h2>
			<div id="game-list">
				<p>Loading&hellip;</p>
			</div>
		</section>

		<section id="upload-section">
			<h2>Or Upload Your Own ROM</h2>
			<div class="row">
				<select id="upload-system"></select>
				<input id="upload-file" type="file" />
				<button id="upload-launch-btn">Launch</button>
			</div>
		</section>

		<div id="status"></div>

		<div id="controls-help">
			<ul>
				<li><span class="key">D-Pad</span> Arrow Keys</li>
				<li><span class="key">A</span> X</li>
				<li><span class="key">B</span> Z</li>
				<li><span class="key">X</span> S</li>
				<li><span class="key">Y</span> A</li>
				<li><span class="key">Start</span> Enter</li>
				<li><span class="key">Select</span> Shift</li>
			</ul>
		</div>

		<div id="canvas-wrapper">
			<canvas id="game-canvas"></canvas>
			<div id="controls" class="row">
				<button id="stop-btn">Stop</button>
				<button id="scale-down-btn">−</button>
				<span id="scale-label">100%</span>
				<button id="scale-up-btn">+</button>
				<button id="fullscreen-btn">Fullscreen</button>
			</div>
		</div>

		<script type="module">
			import { Nostalgist } from "/nostalgist/nostalgist.js";

			// Maps a console/system id to its libretro core name and the
			// vendored core files served from /emulator/cores/.
			const SYSTEMS = {
				nes: { label: "NES", core: "fceumm" },
				snes: { label: "SNES", core: "snes9x" },
				gb: { label: "Game Boy / Color", core: "mgba" },
				gba: { label: "Game Boy Advance", core: "mgba" },
				megadrive: { label: "Genesis / Mega Drive", core: "genesis_plus_gx" },
			};

			const statusEl = document.getElementById("status");
			const canvas = document.getElementById("game-canvas");
			const uploadSystemSelect = document.getElementById("upload-system");
			const uploadFileInput = document.getElementById("upload-file");
			const gameListEl = document.getElementById("game-list");

			let current = null;

			function setStatus(message) {
				statusEl.textContent = message || "";
			}

			for (const [id, { label }] of Object.entries(SYSTEMS)) {
				const option = document.createElement("option");
				option.value = id;
				option.textContent = label;
				uploadSystemSelect.appendChild(option);
			}

			function coreFor(systemId) {
				const system = SYSTEMS[systemId];
				if (!system) throw new Error(`Unknown system: ${systemId}`);
				const { core } = system;
				return {
					name: core,
					js: new URL(`/emulator/cores/${core}_libretro.js`, location.origin).href,
					wasm: new URL(`/emulator/cores/${core}_libretro.wasm`, location.origin).href,
				};
			}

			async function launchGame(systemId, rom) {
				setStatus("Loading…");
				try {
					if (current) {
						await current.exit();
						current = null;
					}
					current = await Nostalgist.launch({
						element: canvas,
						core: coreFor(systemId),
						rom,
						retroarchConfig: {
							video_scale: 5,
						},
					});
					setStatus("");
				} catch (err) {
					console.error(err);
					setStatus(`Failed to launch: ${err.message || err}`);
				}
			}

			const SCALE_STEP = 0.1;
			const SCALE_MIN = 0.5;
			const SCALE_MAX = 2;
			let scale = 1;
			const scaleLabel = document.getElementById("scale-label");

			function applyScale() {
				document.documentElement.style.setProperty("--emu-scale", scale);
				scaleLabel.textContent = `${Math.round(scale * 100)}%`;
			}

			document.getElementById("scale-down-btn").addEventListener("click", () => {
				scale = Math.max(SCALE_MIN, +(scale - SCALE_STEP).toFixed(2));
				applyScale();
			});

			document.getElementById("scale-up-btn").addEventListener("click", () => {
				scale = Math.min(SCALE_MAX, +(scale + SCALE_STEP).toFixed(2));
				applyScale();
			});

			const fullscreenBtn = document.getElementById("fullscreen-btn");
			fullscreenBtn.addEventListener("click", () => {
				if (document.fullscreenElement) {
					document.exitFullscreen();
					return;
				}
				const liveCanvas = current?.getCanvas();
				if (!liveCanvas) {
					setStatus("Launch a game first.");
					return;
				}
				liveCanvas.requestFullscreen().catch((err) => {
					setStatus(`Couldn't enter fullscreen: ${err.message || err}`);
				});
			});

			document.addEventListener("fullscreenchange", () => {
				fullscreenBtn.textContent = document.fullscreenElement ? "Exit Fullscreen" : "Fullscreen";
			});

			document.getElementById("stop-btn").addEventListener("click", async () => {
				if (current) {
					await current.exit();
					current = null;
					setStatus("Stopped.");
				}
			});

			document.getElementById("upload-launch-btn").addEventListener("click", () => {
				const file = uploadFileInput.files[0];
				if (!file) {
					setStatus("Choose a ROM file first.");
					return;
				}
				launchGame(uploadSystemSelect.value, file);
			});

			async function loadLibrary() {
				let manifest = [];
				try {
					const res = await fetch("/emulator/roms/manifest.json");
					manifest = await res.json();
				} catch (err) {
					console.error("Failed to load ROM manifest", err);
				}

				gameListEl.innerHTML = "";
				if (!manifest.length) {
					const p = document.createElement("p");
					p.textContent = "No server-hosted games yet — upload your own ROM below.";
					gameListEl.appendChild(p);
					return;
				}

				for (const game of manifest) {
					const button = document.createElement("button");
					button.textContent = game.title || game.file;
					button.title = game.license ? `License: ${game.license}` : "";
					button.addEventListener("click", () => {
						const url = new URL(`/emulator/roms/${game.file}`, location.origin).href;
						launchGame(game.system, url);
					});
					gameListEl.appendChild(button);
				}
			}

			loadLibrary();
		</script>
	</body>
</html>
